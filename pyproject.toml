[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ebay-bot"
version = "0.1.0"
description = "Standalone eBay publisher for local Kleinanzeigen ad files"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE.txt"]
authors = [{name = "Tomblarom"}]
dependencies = ["requests>=2.32", "platformdirs>=4", "pydantic>=2.11,<3", "ruamel.yaml>=0.18", "wcmatch>=10"]

[project.scripts]
ebay-bot = "ebay_bot.cli:main"

[project.urls]
Repository = "https://github.com/Tomblarom/ebay-bot"
Issues = "https://github.com/Tomblarom/ebay-bot/issues"

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=6", "pytest-xdist>=3", "ruff", "mypy", "basedpyright", "types-requests", "build"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ebay_bot*"]

[tool.setuptools.package-data]
"ebay_bot.resources" = ["*.json"]

[tool.pdm.scripts]
app = "python -m ebay_bot"
format = "ruff format src tests"
lint = {composite = ["ruff check src tests", "mypy src", "basedpyright"]}
test = "pytest tests --cov=ebay_bot --cov-report=term-missing"

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
ignore = ["UP040"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
check_untyped_defs = true

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["unit: isolated component checks", "smoke: minimal CLI health checks", "slow: longer running regression checks"]
